[package]
name = "openfd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lsof that answers instantly: fast, streaming file-descriptor scanner for Linux"

[[bin]]
name = "openfd"
path = "src/main.rs"

[dependencies]
openfd-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
csv = "1"
clap_complete = "4"

[dev-dependencies]
tempfile = "3"
