[package]
name = "openfd"
default-run = "openfd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lsof that answers instantly: fast, streaming file-descriptor scanner for Linux"

[lib]
name = "openfd"
path = "src/lib.rs"

[[bin]]
name = "openfd"
path = "src/main.rs"

[[bin]]
name = "openfd-mangen"
path = "src/bin/openfd-mangen.rs"

[dependencies]
openfd-core = { path = "../core", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
csv = "1"
clap_complete = "4"
clap_mangen = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
