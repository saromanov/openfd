name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: openfd-x86_64-linux
          - target: aarch64-unknown-linux-musl
            archive: openfd-aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build (static)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p openfd --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/openfd stage/${{ matrix.archive }}
          strip stage/${{ matrix.archive }} || true
          cd stage
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: stage/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: stage
      - uses: softprops/action-gh-release@v2
        with:
          files: stage/*
          generate_release_notes: true
