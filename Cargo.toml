[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saromanov/openfd"
description = "lsof that answers instantly: fast, streaming file-descriptor scanner for Linux"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
